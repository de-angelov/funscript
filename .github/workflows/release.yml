name: Prepare npm Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to release (must match package.json)
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify package and prepare artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify package
        run: npm run verify -- --reporter=basic

      - name: Validate requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(process.env.RELEASE_VERSION ?? "")) {
              throw new Error("Release version must be an exact semantic version");
            }
            if (pkg.version !== process.env.RELEASE_VERSION) {
              throw new Error(`Input version ${process.env.RELEASE_VERSION} does not match package.json ${pkg.version}`);
            }
          '

      - name: Create npm tarball
        run: mkdir -p release-artifact && npm pack --pack-destination release-artifact

      - name: Upload GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: funscript-npm-${{ inputs.version }}
          path: release-artifact/*.tgz
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: Create draft GitHub release
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: funscript-npm-${{ inputs.version }}
          path: release-artifact

      - name: Create draft release with package tarball
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(--draft --target main --title "FunScript v${RELEASE_VERSION}" --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then args+=(--prerelease); fi
          gh release create "v${RELEASE_VERSION}" release-artifact/*.tgz "${args[@]}"
