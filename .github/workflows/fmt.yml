name: Check Code Formatting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format:
    name: FunScript Formatter & Prettier Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build FunScript
        run: npm run build

      - name: Check FunScript formatting (CLI)
        run: |
          for f in $(find examples programs -name "*.fun"); do
            node dist/cli/index.js fmt "$f" --check
          done

      - name: Check FunScript formatting (Prettier)
        run: npx prettier --check "**/*.fun"
