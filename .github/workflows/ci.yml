name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Format & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package artifacts
        run: npm run build 2>&1 | tee build.log

      - name: Type check (tsc --noEmit)
        run: npm run check

      - name: Check generated reference documentation
        id: docs_gate
        continue-on-error: true
        run: npm run docs:check

      - name: Auto-rebuild reference documentation on drift
        id: docs_rebuild
        if: steps.docs_gate.outcome == 'failure'
        run: |
          echo "::warning::Reference documentation is out of date. Auto-rebuilding reference docs to recover..."
          npm run docs:generate
          echo "rebuilt=true" >> "$GITHUB_OUTPUT"

      - name: Auto-commit and push updated reference documentation
        if: steps.docs_rebuild.outputs.rebuilt == 'true'
        run: |
          if [ -n "$(git status --porcelain docs/ README.md)" ]; then
            echo "Committing updated reference documentation..."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/ README.md
            git commit -m "docs: auto-rebuild reference documentation [skip ci]" || true
            if [ -n "${{ github.head_ref }}" ]; then
              git push origin HEAD:${{ github.head_ref }} || echo "::warning::Could not push to PR branch (likely from fork)"
            else
              git push || echo "::warning::Could not push to branch"
            fi
          fi

      - name: Check FunScript formatting
        run: npm run fmt:check

      - name: Check TypeScript source formatting
        run: npm run fmt:ts:check

      - name: Lint TypeScript source (ESLint + Effect rules)
        run: npm run lint

      - name: Check Markdown formatting
        run: npm run prettier:check

      - name: Run test suite (editor tooling and integrations)
        run: npm test -- --reporter=basic 2>&1 | tee test.log

      - name: Run example application integration tests
        run: npm run test:examples -- --reporter=basic 2>&1 | tee examples-test.log

      - name: Verify npm package contents
        run: npm run package:check

      - name: Use minimum supported Node.js for consumer smoke test
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify package on Node.js 20
        run: npm run package:check

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build.log
            test.log
            examples-test.log
            dist/**/*.map
