name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build, Verify & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run typechecking
        run: npx tsc --noEmit

      - name: Run VS Code extension typechecking
        run: npx tsc -p editors/vscode --noEmit

      - name: Check FunScript formatting (CLI)
        run: npm run fmt:check

      - name: Check formatting (Prettier)
        run: npm run prettier:check

      - name: Build package artifacts
        run: npm run build

      - name: Run full test suite
        run: npm test

  agent-pr-validation:
    name: GitHub Agent PR Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Agent PR Validation Check
        run: node scripts/validate-pr.js
